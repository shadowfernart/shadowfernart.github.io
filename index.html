      (function () {

                  '<span lang="en" class="' + (lang === "en" ? "is-on" : "") + '">EN</span>' +
                "</button>" +
                '<button type="button" class="x-theme" data-theme-toggle aria-label="' + esc(themeNow() === "dark" ? L.ui.toLight : L.ui.toDark) + '">' + (themeNow() === "dark" ? "☀" : "☾") + "</button>" +
              "</div>" +
            "</header>" +
            '<main class="main">' +
              '<section class="hero">' +
                '<img class="hero__img" src="' + esc(src(C.images.hero)) + '" alt="' + esc(L.hero.imageAlt) + '" />' +
                '<div class="hero__copy"><p class="hero__eyebrow">' + esc(L.hero.eyebrow) + "</p><h1>" + esc(L.hero.title) + "</h1>" +
                '<p class="hero__sub">' + esc(L.hero.subtitle) + "</p>" +
                '<div class="links"><a class="btn x-primary" href="#' + esc(first) + '">' + esc(L.hero.button) + "</a></div></div>" +
              "</section>" +

              '<section class="section" id="living-artwork" data-nav="' + esc(L.nav.about) + '">' +
                head(L.about.eyebrow, L.about.title) +
                '<div class="prose">' + map(L.about.paragraphs, function (p) { return "<p>" + esc(p) + "</p>"; }) + "</div>" +
                '<div class="cards">' + map(L.about.cards, function (c) { return "<div><h3>" + esc(c.title) + "</h3><p>" + esc(c.text) + "</p></div>"; }) + "</div>" +
              "</section>" +

              map(works, function (a, i) { return artwork(a, i, L, lang); }) +

              '<section class="section" id="ve-shadow-fern" data-nav="' + esc(L.nav.studio) + '">' +
                head(L.studio.eyebrow, L.studio.title) +
                '<div class="prose">' + map(L.studio.paragraphs, function (p) { return "<p>" + esc(p) + "</p>"; }) + "</div>" +
                (L.studio.quote ? '<p class="x-studio-quote">“' + esc(L.studio.quote) + "”</p>" : "") +
              "</section>" +

              '<section class="section" id="chung-nhan" data-nav="' + esc(L.nav.certificate) + '">' +
                head(L.certificate.eyebrow, L.certificate.title) +
                '<div class="prose">' + map(L.certificate.paragraphs, function (p) { return "<p>" + esc(p) + "</p>"; }) +
                '<p lang="en"><em>“' + esc(C.certificateLine) + "”</em></p></div>" +
                grid(certs, lang, " x-doc") +
                grid(C.images.seals || [], lang) +
              "</section>" +

              '<section class="x-quote" aria-label="' + esc(L.ui.quote) + '"><p lang="en">' + esc(C.quote) + "</p></section>" +

              '<section class="section" id="so-huu" data-nav="' + esc(L.nav.collect) + '">' +
                head(L.collect.eyebrow, L.collect.title) +
                '<div class="steps">' + map(L.collect.steps, function (s, i) {
                  return '<article class="step"><div class="step__intro"><p class="step__num">' + (i < 9 ? "0" : "") + (i + 1) + "</p></div><div><h3>" + esc(s) + "</h3></div></article>";
                }) + "</div>" +
                '<p class="fineprint">' + esc(L.collect.note) + "</p>" +
              "</section>" +

              '<section class="section" id="van-chuyen" data-nav="' + esc(L.nav.shipping) + '">' +
                head(L.shipping.eyebrow, L.shipping.title) +
                '<div class="x-shipgrid">' + map(L.shipping.items, function (it) { return "<div><h3>" + esc(it.title) + "</h3><p>" + esc(it.text) + "</p></div>"; }) + "</div>" +
                '<p class="fineprint">' + esc(L.shipping.note) + "</p>" +
              "</section>" +

              '<section class="section" id="ket-noi" data-nav="' + esc(L.nav.connect) + '">' +
                head(L.connect.eyebrow, L.connect.title) +
                '<div class="prose"><p>' + esc(L.connect.text.replace("{works}", joined)) + "</p></div>" +
                '<div class="links"><a class="btn x-primary" ' + ext(C.links.message) + ">" + esc(L.connect.message) + "</a></div>" +
                '<div class="links">' +
                  '<a class="btn" ' + ext(C.links.facebook) + ">Facebook</a>" +
                  '<a class="btn" ' + ext(C.links.instagram) + ">Instagram</a>" +
                  '<a class="btn" ' + ext(C.links.threads) + ">Threads</a>" +
                  '<a class="btn" ' + ext(C.links.youtube) + ">YouTube</a>" +
                "</div>" +
              "</section>" +
            "</main>" +
            '<footer class="foot"><p class="x-foot"><img src="' + esc(src(C.images.logo)) + '" alt="" />' + esc(L.footer) + "</p></footer>";

          [].forEach.call(page.querySelectorAll(".band img"), function (im) {
            var mark = function () { if (im.naturalHeight > im.naturalWidth) im.parentNode.classList.add("is-portrait"); };
            if (im.complete) mark(); else im.addEventListener("load", mark);
          });
        }

        page.addEventListener("toggle", function (e) {
          var d = e.target;
          if (d && d.matches && d.matches("details[data-spec]")) openSpecs[d.getAttribute("data-spec")] = d.open;
        }, true);

        page.addEventListener("click", function (e) {
          var tb = e.target.closest("[data-theme-toggle]");
          if (tb) {
            var next = themeNow() === "dark" ? "light" : "dark";
            document.documentElement.setAttribute("data-theme", next);
            try { localStorage.setItem("sf-theme", next); } catch (err) {}
            var y0 = window.scrollY; render(currentLang); window.scrollTo(0, y0);
            var nt = page.querySelector(".x-theme"); if (nt) nt.focus();
            return;
          }
          var b = e.target.closest("[data-lang]");
          if (!b) return;
          var lang = b.getAttribute("data-lang");
          var y = window.scrollY;
          render(lang);
          window.scrollTo(0, y);
          var nb = page.querySelector(".x-lang");
          if (nb) nb.focus();
        });

        render("vi");
      })();
    </script>
    <script src="hark.js"></script>
  </body>
</html>
